name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    env:
      # Non-secret dummy values: check-env validates configuration shape only.
      APP_ENV: local
      LAKE_BUCKET: metrictrace-lake
      LAKE_ENDPOINT_URL: http://localhost:9000
      RUSTFS_ACCESS_KEY: ci
      RUSTFS_SECRET_KEY: ci-password
      AWS_REGION: us-east-1
      CUBE_API_URL: http://cube:4000
      API_URL: http://api:8000
      LLM_PROVIDER: fake
      LLM_MODEL: fake
      CUBE_API_SECRET: ci-cube-secret-not-for-production-use-0001
      API_BEARER_TOKEN: ci-bearer-token-not-for-production-use-001
      SIM_START_DATE: "2017-01-01"
      SIM_END_DATE: "2018-08-31"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: make install
      - run: make lint
      - run: make check-env
      - run: make test-unit

  lake:
    # The job name is a required status check on main; keep it unchanged.
    name: Lake integration (RustFS)
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      LAKE_BUCKET: metrictrace-lake
      LAKE_ENDPOINT_URL: http://localhost:9000
      RUSTFS_ACCESS_KEY: ci
      RUSTFS_SECRET_KEY: ci-password
      AWS_REGION: us-east-1
      CUBE_API_URL: http://localhost:4000
      API_URL: http://localhost:8000
      LLM_PROVIDER: fake
      LLM_MODEL: fake
      CUBE_API_SECRET: ci-cube-secret-not-for-production-use-0001
      API_BEARER_TOKEN: ci-bearer-token-not-for-production-use-001
      SIM_START_DATE: "2017-01-01"
      SIM_END_DATE: "2018-08-31"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: make install
      # The same Compose stack as local development: RustFS, the lake bucket, then Cube.
      - run: docker compose up -d --wait rustfs
      - run: docker compose run --rm lake-init
      - run: make test-lake
      - run: make test-ingestion
      - run: make test-dbt
      - run: make test-semantic
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200
