name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    env:
      # Non-secret dummy values: check-env validates configuration shape only.
      APP_ENV: local
      LAKE_BUCKET: metrictrace-lake
      LAKE_ENDPOINT_URL: http://localhost:9000
      RUSTFS_ACCESS_KEY: ci
      RUSTFS_SECRET_KEY: ci-password
      AWS_REGION: us-east-1
      CUBE_API_URL: http://cube:4000
      API_URL: http://api:8000
      LLM_PROVIDER: fake
      LLM_MODEL: fake
      CUBE_API_SECRET: ci-cube-secret
      API_BEARER_TOKEN: ci-bearer-token
      SIM_START_DATE: "2017-01-01"
      SIM_END_DATE: "2018-08-31"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: make install
      - run: make lint
      - run: make check-env
      - run: make test-unit

  lake:
    name: Lake integration (RustFS)
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ci
          RUSTFS_SECRET_KEY: ci-password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: local
      LAKE_BUCKET: metrictrace-lake
      LAKE_ENDPOINT_URL: http://localhost:9000
      RUSTFS_ACCESS_KEY: ci
      RUSTFS_SECRET_KEY: ci-password
      AWS_REGION: us-east-1
      CUBE_API_URL: http://localhost:4000
      API_URL: http://localhost:8000
      LLM_PROVIDER: fake
      LLM_MODEL: fake
      CUBE_API_SECRET: ci-cube-secret
      API_BEARER_TOKEN: ci-bearer-token
      SIM_START_DATE: "2017-01-01"
      SIM_END_DATE: "2018-08-31"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: make install
      - name: Create lake bucket
        env:
          AWS_ACCESS_KEY_ID: ci
          AWS_SECRET_ACCESS_KEY: ci-password
        run: aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket "$LAKE_BUCKET"
      - run: make test-lake
      - run: make test-ingestion
