[project]
name = "metrictrace"
version = "0.1.0"
description = "Governed metrics platform with an LLM agent that explains metric changes (Olist marketplace)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "kagglehub>=1.0.2",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "s3fs>=2026.9.0",
    "tenacity>=9.2.1",
]

[project.scripts]
metrictrace = "metrictrace.pipeline:main"
metrictrace-check-env = "metrictrace.config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrictrace"]

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "sqlfluff>=4.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "C4", "PT", "TID"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["s3fs", "s3fs.*", "fsspec", "fsspec.*", "kagglehub"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs the local stack (make up)"]

[tool.coverage.run]
source = ["src/metrictrace"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
